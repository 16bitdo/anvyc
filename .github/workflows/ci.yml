name: CI

# main push / PR 마다 lint + type-check + test 를 실행해 회귀를 잡는다.
#
# 비용 최적화 (private repo 과금 기준 — public 전환 시 Actions 무료):
#   GitHub Actions 는 잡당 분 단위 올림 과금 + macOS 10× 배수. 모든 잡이 1분
#   미만이므로 비용 = Σ(잡 수 × OS 배수)이고, 캐싱 등 속도 최적화는 비용에
#   영향이 없다. 따라서 macOS 잡 노출 빈도가 핵심 레버다.
#
#     - PR        : lint + ubuntu test 3.11/3.12/3.13      → 4 과금분
#     - main push : 위 + macOS 3.13 test (실 플랫폼 회귀)   → 14 과금분
#
#   anvyc 는 macOS 전용 도구지만 테스트가 sys.platform monkeypatch + skipif 로
#   가드돼 대부분 Linux 에서 동일하게 검증된다. macOS 실회귀는 main 병합 후
#   1회만 확인하면 충분하므로 PR 단계에서는 macOS 잡(test-macos)을 건너뛴다.
#
# 추가 절감: (1) 문서 전용 변경(**.md, docs/**)은 CI skip, (2) concurrency 로
# PR 에 push 가 연달아 들어오면 추월된 run 을 취소 (main push 는 항상 완주),
# (3) timeout-minutes 로 행(hang) 잡의 폭주 과금을 차단.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Install anvyc + dev deps
        run: uv pip install --system -e ".[dev,encryption,mcp]"

      - name: Ruff
        run: ruff check src/ tests/

      - name: Mypy
        run: mypy src/anvyc/ tests/

  test:
    name: Test (ubuntu, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install anvyc + dev deps
        run: uv pip install --system -e ".[dev,encryption,mcp]"

      # 2 step 분리 — unit 회귀가 발생하면 integration step 으로 넘어가지 않고
      # 빠르게 fail 보고 (CI 분 절약 + 피드백 단축). 자동 마킹은
      # tests/integration/conftest.py 의 pytest_collection_modifyitems hook 이 담당.
      - name: Pytest (unit, fast-fail gate)
        run: pytest -m "not integration"

      - name: Pytest (integration)
        run: pytest -m integration

  # macOS 실 플랫폼 회귀 — main push(병합 후)에만 실행한다.
  # macOS 러너는 10× 과금이므로 빈번한 PR 단계에서는 제외 (위 주석 참고).
  test-macos:
    name: Test (macOS, Python 3.13)
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Install anvyc + dev deps
        run: uv pip install --system -e ".[dev,encryption,mcp]"

      - name: Pytest (unit, fast-fail gate)
        run: pytest -m "not integration"

      - name: Pytest (integration)
        run: pytest -m integration
