name: CI

# main push / PR 마다 lint + type-check + test 를 실행해 회귀를 잡는다.
# scope: src/ + tests/ ruff, src/ mypy, 전체 pytest.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, type-check, test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Install anvyc + dev deps
        run: uv pip install --system -e ".[dev,encryption,mcp]"

      - name: Ruff
        run: ruff check src/ tests/

      - name: Mypy
        run: mypy src/anvyc/

      - name: Pytest
        run: pytest
