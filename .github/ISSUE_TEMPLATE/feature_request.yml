name: 기능 제안 (Feature request)
description: anvyc 에 새 기능 / 개선 / 새 adapter 등을 제안합니다.
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        anvyc 개선 제안을 시작해 주셔서 감사합니다.

        - 일반 질문 / 사용법 토론은 issue 대신 GitHub Discussion (활성화 시) 또는 [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) 의 채널을 이용해 주세요.

  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제 / 동기
      description: 어떤 사용자 시나리오 / 작업 흐름이 현재 어렵거나 불가능한가요?
      placeholder: "현재 anvyc 는 X 를 못 해서 사용자가 Y 를 수동으로 해야 한다 / Z 도구와 정합 안 된다 / ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안 해결 방안
      description: 가능하면 명령 / 설정 / API 형태로 구체화. 대안이 있다면 함께.
      placeholder: |
        ```bash
        anvyc <new-command> [...]
        ```
        또는 anvyc.yaml 의 `tools.X` 에 신규 옵션 `Y` 추가 / ...
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 영향 범위 (해당 시)
      description: 본 제안이 주로 어느 영역에 닿나요?
      multiple: true
      options:
        - 신규 adapter (e.g., 새 도구 backup 지원)
        - 기존 adapter 보강
        - CLI 명령 (sub-command 추가/변경)
        - MCP server (read-only tool 추가)
        - secret-scan / 보안 정책
        - snapshot / sync / creds (control plane)
        - 설정 / config schema
        - 설치 / 배포 (Homebrew, install.sh, release.yml)
        - 문서 / 가이드
        - 기타

  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 대안 (선택)
      description: 다른 도구 / 기존 anvyc 기능 / 사용자 측 workaround 등

  - type: checkboxes
    id: checklist
    attributes:
      label: 사전 확인
      options:
        - label: 동일 / 유사 제안이 이미 열려있지 않다 (검색 완료)
          required: true
        - label: 본 제안이 anvyc 의 핵심 약속 (도구별 safe adapter / secret 기본 제외 / apply 전 dry-run / restore 전 local backup) 과 정합한다 (또는 정합 여부를 본문에서 명시 토론한다)
          required: true
