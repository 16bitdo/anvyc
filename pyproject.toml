[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "anvyc"
version = "0.21.0"
description = "여러 장치에서 개발 도구 설정 정보와 인증 정보를 안전하게 백업/비교/복원/동기화하는 macOS CLI. 도구별 safe adapter + backup/rollback 안전망 + SOPS + 1Password Secret Reference 통합."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "edward", email = "16bitdo@gmail.com" }
]
keywords = [
  "dotfiles", "config-sync", "backup", "macos", "developer-tools",
  "claude-code", "cursor", "iterm2", "aws", "github-cli", "pulumi",
  "sops", "1password", "age-encryption", "secret-management",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Archiving :: Backup",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pathspec>=0.12",
  "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10"
]
encryption = [
  "cryptography>=42.0"
]
mcp = [
  # 상한 고정 — mcp 2.0.0 은 breaking change(Tool.inputSchema→input_schema,
  # Server.list_tools 제거)를 포함한 major 이고, 상한 없는 `>=1.0` 이 이를
  # 자동 수용해 CI 만 red 가 됐다(로컬 1.27.1 / CI 2.0.0 → 재현 불가).
  # 2.x 마이그레이션은 별도 계획으로 진행한다.
  "mcp>=1.0,<2"
]
cost-aws = [
  "boto3>=1.34"
]
cost-github = [
  "httpx>=0.27"
]
tui = [
  "textual>=0.50"
]

[project.scripts]
anvyc = "anvyc.cli:app"

[project.urls]
Homepage = "https://github.com/16bitdo/anvyc"
Repository = "https://github.com/16bitdo/anvyc"
Documentation = "https://github.com/16bitdo/anvyc/blob/main/DESIGN.md"
Issues = "https://github.com/16bitdo/anvyc/issues"
Changelog = "https://github.com/16bitdo/anvyc/blob/main/RELEASE_NOTES.md"
Contributing = "https://github.com/16bitdo/anvyc/blob/main/CONTRIBUTING.md"
Security = "https://github.com/16bitdo/anvyc/blob/main/SECURITY.md"

[tool.hatch.build.targets.wheel]
packages = ["src/anvyc"]

# 빌드 시 소스 커밋을 src/anvyc/_build_info.py 로 새긴다 (hatch_build.py).
# 릴리스 배치 버저닝이라 version 하나가 여러 커밋을 덮는다 — 로컬 소스로 설치한
# 환경에서 "무엇이 깔렸는가" 를 답하려면 커밋이 필요하다.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

# _build_info.py 는 gitignore 대상(빌드 산출물)이라 hatchling 의 기본 VCS-ignore
# 규칙에 걸려 wheel/sdist 에서 빠진다. artifacts 로 명시 포함한다 — 이 한 줄이
# 없으면 훅이 파일을 만들어도 배포본에 실리지 않아 기능이 조용히 무력해진다.
[tool.hatch.build]
artifacts = ["src/anvyc/_build_info.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# typer 의 Option/Argument, Path 는 default-arg 로 안전 (immutable).
extend-immutable-calls = ["typer.Option", "typer.Argument", "pathlib.Path"]

[tool.mypy]
python_version = "3.11"
# anvyc 는 macOS 전용 — CI 가 ubuntu 에서 mypy 를 돌려도 os.chflags 등
# macOS-only API 를 인식하도록 type-check 플랫폼을 darwin 으로 고정한다.
platform = "darwin"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: integration tests requiring filesystem fixtures",
  "macos: macOS-specific behavior"
]
