[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "anvyc"
version = "0.7.1"
description = "여러 장치에서 개발 도구 설정 정보와 인증 정보를 안전하게 백업/비교/복원/동기화하는 macOS CLI. 도구별 safe adapter + backup/rollback 안전망 + SOPS + 1Password Secret Reference 통합."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "edward", email = "16bitdo@gmail.com" }
]
keywords = [
  "dotfiles", "config-sync", "backup", "macos", "developer-tools",
  "claude-code", "cursor", "iterm2", "aws", "github-cli", "pulumi",
  "sops", "1password", "age-encryption", "secret-management",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Archiving :: Backup",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.6",
  "pathspec>=0.12",
  "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10"
]
encryption = [
  "cryptography>=42.0"
]

[project.scripts]
anvyc = "anvyc.cli:app"

[project.urls]
Homepage = "https://github.com/16bitdo/anvyc"
Repository = "https://github.com/16bitdo/anvyc"
Documentation = "https://github.com/16bitdo/anvyc/blob/main/DESIGN.md"
Issues = "https://github.com/16bitdo/anvyc/issues"
Changelog = "https://github.com/16bitdo/anvyc/blob/main/RELEASE_NOTES.md"
Contributing = "https://github.com/16bitdo/anvyc/blob/main/CONTRIBUTING.md"
Security = "https://github.com/16bitdo/anvyc/blob/main/SECURITY.md"

[tool.hatch.build.targets.wheel]
packages = ["src/anvyc"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: integration tests requiring filesystem fixtures",
  "macos: macOS-specific behavior"
]
