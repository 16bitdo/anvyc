# anvyc.yaml — 모든 옵션의 explicit reference.
# `anvyc init` 가 작성하는 minimal default 는 `src/anvyc/templates.py` 의
# `DEFAULT_ANVYC_YAML` (옵션 값을 비우면 adapter defaults 사용 의도).
# 본 파일은 그 default 와 동일한 값을 explicit 하게 적은 reference — 사용자가
# 어떤 옵션이 있는지 한 파일에서 보고 자기 환경에 맞게 조정하기 위한 것.

version: 1

storage:
  root: ".anvyc"
  keep_backups: 5
  keep_local_backups: 5

security:
  secret_scan: true
  block_on_secret: true
  allow_encrypted_secrets: true

tools:
  shell:
    enabled: true
    files:
      - "~/.zshrc"
      - "~/.zprofile"

  git:
    enabled: true
    files:
      - "~/.gitconfig"
      - "~/.gitignore_global"

  aws:
    enabled: true
    include:
      - "~/.aws/config"
    exclude:
      - "~/.aws/credentials"

  gh:
    enabled: true
    include:
      - "~/.config/gh/config.yml"
    exclude:
      - "~/.config/gh/hosts.yml"

  cursor:
    enabled: true

    # Layer A — ~/.cursor (user-global rules/skills/mcp/plugins)
    # include 키 생략 → DEFAULT 수집 / "include: []" → 이 Layer backup 비활성.
    global:
      include:
        - "~/.cursor/rules"
        - "~/.cursor/skills"
        - "~/.cursor/skills-cursor"
        - "~/.cursor/mcp.json"
        - "~/.cursor/plugins/local"
        - "~/.cursor/plans"
      exclude:
        - "~/.cursor/cli-config.json"
        - "~/.cursor/argv.json"
        - "~/.cursor/ide_state.json"
        - "~/.cursor/extensions"
        - "~/.cursor/projects"
        - "~/.cursor/workers"
        - "~/.cursor/ai-tracking"
        - "~/.cursor/chats"
        - "~/.cursor/plugins/cache"
        - "~/.cursor/prompt_history.json"
      follow_symlinks: false
      backup_metadata_for_symlinks: true
      mask_mcp_tokens: true

    # Layer B — Cursor IDE user config (settings/keybindings/snippets/profiles)
    # include 키 생략 → DEFAULT 수집 / "include: []" → 이 Layer backup 비활성.
    ide:
      include:
        - "~/Library/Application Support/Cursor/User/settings.json"
        - "~/Library/Application Support/Cursor/User/keybindings.json"
        - "~/Library/Application Support/Cursor/User/snippets"
        - "~/Library/Application Support/Cursor/User/profiles"
      exclude:
        - "~/Library/Application Support/Cursor/User/History"
        - "~/Library/Application Support/Cursor/User/workspaceStorage"
        - "~/Library/Application Support/Cursor/User/globalStorage"
      include_bak_files: false
      global_storage_allowlist: []   # 예: ["anysphere.cursor-mcp"]

    # Layer C — project-local .cursor (opt-in)
    projects:
      enabled: false
      roots: []                       # 예: ["~/dev/anvyc"]
      patterns:
        - ".cursor/rules"
        - ".cursor/skills"
        - ".cursor/mcp.json"
        - ".cursorrules"

  claude:
    enabled: true
    include:
      - "~/.claude/settings.json"
      - "~/.claude/hooks"
      - "~/.claude/plugins"
    exclude:
      - "~/.claude/sessions"
      - "~/.claude/tokens"
      - "~/.claude/cache"
      - "~/.claude/logs"

  iterm2:
    enabled: true
    mode: "safe"
    include:
      - "profiles"
      - "key_mappings"
      - "color_presets"
    exclude:
      - "window_state"
      - "recent_sessions"

  pulumi:
    enabled: true
    include:
      - "~/.pulumi/config.json"
    exclude:
      - "~/.pulumi/credentials.json"

  # dev_env adapter (v0.7.0+) — direnv/asdf/pyenv/nvm 등 프로젝트별 환경 파일 추적.
  # default disabled — 사용자가 명시 enable 해야 안전 시작 (project scan 부담 회피).
  dev_env:
    enabled: false
    project_roots:
      - "~/dev"
    patterns:
      - ".envrc"
      - ".tool-versions"
      - ".python-version"
      - ".nvmrc"
    exclude:
      - "**/node_modules/**"
      - "**/.venv/**"
      - "**/venv/**"
      - "**/.git/**"
      - "**/__pycache__/**"

  # shell_prompt adapter (v0.13.0+) — starship / powerlevel10k prompt 설정.
  shell_prompt:
    enabled: true
    include:
      - "~/.config/starship.toml"
      - "~/.p10k.zsh"

doctor:
  cross_user:
    enabled: true
    # /Users/<key> 가 /Users/<value> 로 resolve 되는 alias 선언.
    # 예: macOS 사용자명 변경 후 호환성용 symlink 가 있는 경우.
    known_user_aliases: {}
    # 예: known_user_aliases: { aliasuser: edward }
    scan_targets:
      - "~/.cursor/projects"
      - "~/.zshrc"
      - "~/.zprofile"
      - "~/.gitconfig"
      - "~/.ssh/config"
      - "~/.ssh/config.d"
      - "~/Library/Application Support/Cursor/User/settings.json"
      - "~/Library/Application Support/Cursor/User/keybindings.json"
      - "~/.claude/settings.json"
      - "~/.claude/CLAUDE.md"
    severity_overrides: {}     # path glob → "info"|"warning"|"critical"
  # CP-5 creds-expiry 체크의 per-kind "expiring" 경고 임계 (kind → 초).
  # 미지정 kind 는 코드 기본값(aws_sso 900=15min / github·claude_oauth 604800=7d).
  # org 의 SSO 세션 TTL 이나 회전 리드타임에 맞춰 조정. expired(CRITICAL)는 무관.
  creds_expiry:
    warn_thresholds: {}        # 예: { aws_sso: 1800, github: 1209600 }

# CP-13 PR-13D + polish CP-13H — cost observability adapter 설정.
# 부재 시 GitHub adapter 가 ~/.config/gh* glob walk 으로 자동 discover
# (user-level 만). 사용자가 org-level billing 도 가시화하려면 본 옵션에
# "user@org" syntax 명시.
#
# fine-grained PAT 의 Resource owner / scope 매핑:
#   - "16bitdo"          → /users/16bitdo/.../billing/usage     (Account Plan:Read 또는 OAuth user scope)
#   - "heisgone@whatap"  → /organizations/whatap/.../billing/usage (Org Administration:Read)
cost:
  github:
    accounts: []
    # 예 (multi-account billing visibility):
    # accounts:
    #   - "16bitdo"
    #   - "heisgone@whatap"

# CP-15 Secret Broker (Phase 1, read-only) — reference 레지스트리.
# anvyc 는 secret "값" 을 저장하지 않는다. 아래 entry 는 backend(op/sops/keychain/
# aws-vault)에 저장된 secret 을 가리키는 "핸들" 만 보유한다 (backup/git commit 안전).
# `anvyc secret list` 로 조회/검증, doctor `secret-registry-valid` 로 구조 점검.
# add/get/inject-wire 는 Phase 2+ (docs/design-axes/cp-15-secret-broker.md §9).
secrets:
  schema_version: 1
  get:
    default_sink: clipboard          # clipboard | reveal — get 기본 동작 (Phase 2)
    clipboard_clear_seconds: 20
  entries: []
    # 예 (backend 별 핸들 — 값 아님):
    # - name: AWS_ACCESS_KEY_ID         # op: op://<vault>/<item>/<field>
    #   backend: op
    #   ref: "op://Personal/AWS/access_key_id"
    #   wire: { target: "~/.zshrc", style: "op-read" }   # (선택) Phase 2.5 JIT 주입
    # - name: pulumi/passphrase         # sops: 파일 + (inplace) dotted key
    #   backend: sops
    #   file: "~/.pulumi/creds.json"
    #   key: "passphrase"
    # - name: DB_PW                      # keychain (macOS): service + account
    #   backend: keychain
    #   service: "anvyc"
    #   account: "db"
    # - name: aws/prd                    # aws-vault: profile
    #   backend: aws-vault
    #   profile: "my-prd"
